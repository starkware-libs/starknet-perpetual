name: CI

on:
  pull_request:

jobs:
  cairo_tests:
    runs-on: namespace-profile-starkware-libs-starknet-perpetual-xlarge-hm-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Starknet Foundry (nightly)
        env:
          TAG: nightly-2026-02-03
          GH_REPO: software-mansion-labs/starknet-foundry-nightlies
        run: |
          set -euo pipefail

          url="$(
            python3 - <<'PY'
import json, os, re, sys, urllib.request

tag = os.environ["TAG"]
repo = os.environ["GH_REPO"]
api = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"

with urllib.request.urlopen(api) as r:
    data = json.load(r)

assets = [a.get("browser_download_url","") for a in data.get("assets", [])]
pat = re.compile(r"linux.*(amd64|x86_64).*\.tar\.gz$", re.IGNORECASE)
cands = [u for u in assets if pat.search(u)]

if not cands:
    print("No matching linux amd64/x86_64 .tar.gz asset found.", file=sys.stderr)
    for u in assets:
        print(" -", u, file=sys.stderr)
    sys.exit(1)

print(cands[0])
PY
          )"

          mkdir -p "$HOME/.snfoundry"
          curl -sSfL "$url" | tar -xz -C "$HOME/.snfoundry"
          echo "$HOME/.snfoundry/bin" >> "$GITHUB_PATH"

          snforge --version
          sncast --version

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.15.1"

      - name: Build Contracts
        run: scarb build

      - name: Install cairo-coverage
        run: |
          curl -L https://raw.githubusercontent.com/software-mansion/cairo-coverage/main/scripts/install.sh | sh

      - name: Run test and coverage
        run: scarb test -w --coverage

      - name: Check formatting
        run: scarb fmt -w --check

  python_tests:
    runs-on: namespace-profile-starkware-libs-starknet-perpetual-xlarge-hm-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install asdf
        run: scripts/install_asdf.sh

      - name: Install starknet-devnet
        run: |
          asdf plugin add starknet-devnet
          asdf install starknet-devnet 0.7.2
          asdf global starknet-devnet 0.7.2

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.15.1"

      - name: Build Contracts
        run: scarb --release build

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run Python Tests
        id: run_tests
        run: scripts/python_tests.sh

[workspace]
members = ["workspace/apps/perpetuals/contracts", "workspace/vault/", "workspace/fulfillment"]

[workspace.dependencies]
starknet = "2.15.1"
assert_macros = "2.15.1"
openzeppelin = "3.0.0"
snforge_std = { version = "0.55.0+nightly-2026-02-03", registry = "https://scarbs.dev/" }
starkware_utils = { git = "https://github.com/starkware-libs/starkware-starknet-utils", branch = "0.55.0-nightly-2026-02-03" }
starkware_utils_testing = { git = "https://github.com/starkware-libs/starkware-starknet-utils", branch = "0.55.0-nightly-2026-02-03" }

[scripts]
test = "snforge test --run-native"

[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"
panic-backtrace = true

[profile.release.cairo]
inlining-strategy = 30

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

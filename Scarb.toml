[workspace]
members = ["workspace/apps/perpetuals/contracts"]

[workspace.dependencies]
starknet = "2.11.4"
assert_macros = "2.11.4"
openzeppelin = "1.0.0"
openzeppelin_testing = "3.0.0"
snforge_std = "0.41.0"
starkware_utils = { git = "https://github.com/starkware-libs/starkware-starknet-utils", rev = "3d7996871a6b1cd0aae2d4859bccbc31ab32348f" }
starkware_utils_testing = { git = "https://github.com/starkware-libs/starkware-starknet-utils", rev = "3d7996871a6b1cd0aae2d4859bccbc31ab32348f" }

[scripts]
test = "snforge test"

[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
